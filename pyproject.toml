[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-file-organizer"
version = "1.1.0"
description = "Cross-platform duplicate file organizer with verified copy, Flat or Year/Location organization, metadata-aware date resolution and recovery"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.8,<7", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[project.scripts]
duplicate-file-organizer = "duplicate_file_organizer.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
